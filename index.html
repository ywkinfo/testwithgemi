<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 첫 배포 🚀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #333;
        }

        .emoji {
            font-size: 5rem;
            margin-bottom: 30px;
            display: block;
        }

        p {
            font-size: 1.2rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 20px;
        }

        .info {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #f0f0f0;
        }

        .info h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .info ul {
            list-style: none;
            text-align: left;
            display: inline-block;
        }

        .info li {
            padding: 8px 0;
            color: #555;
        }

        .info li::before {
            content: "✓ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="emoji">🎉</span>
        <h1>첫 배포 경축</h1>
        <p>
            축하합니다! GitHub와 Vercel을 통해<br>
            웹사이트가 성공적으로 배포되었습니다.
        </p>
        <div class="badge">Live on Vercel</div>

        <div class="info">
            <h2>구현된 기능</h2>
            <ul>
                <li>반응형 디자인</li>
                <li>그라데이션 배경</li>
                <li>모던한 UI/UX</li>
                <li>GitHub + Vercel 연동</li>
            </ul>
        </div>
    </div>
</body>
</html>
